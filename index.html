<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Recipes, weekly menu planner, shopping list and kitchen conversions">
<title>Cooking</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f5efe0;--card:#fffaf0;--ink:#3b2a1e;--muted:#8a7a66;--line:#e3d8c0;--acc:#b5532a;--acc2:#7a4a2a;--ok:#4f7a3a;--chip:#efe4cc;--danger:#a83232}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:var(--acc2);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:.95rem;white-space:nowrap}
header .back{font-size:1.3rem;padding:4px 12px}
main{padding:12px 12px calc(86px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs a{flex:1;text-align:center;padding:7px 0 6px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600}
nav.tabs a span{display:block;font-size:1.35rem;line-height:1.25;filter:grayscale(.6);opacity:.75}
nav.tabs a.on{color:var(--acc)}
nav.tabs a.on span{filter:none;opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:1.3rem;margin:4px 0 6px}
h3{font-size:1.02rem;margin:0 0 8px;color:var(--acc2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem;text-align:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:6px 10px;font-size:.82rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:130px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.nf{flex:none}
.between{justify-content:space-between}
.mt{margin-top:8px}.mb{margin-bottom:8px}
.muted{color:var(--muted);font-size:.85rem}
.small{font-size:.8rem}
.center{text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem}
.chip small{opacity:.6}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rcard{display:flex;gap:10px;align-items:center;cursor:pointer}
.rcard img,.rcard .ph{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.rc-body{min-width:0;flex:1}
.rc-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.mini-tags span{font-size:.7rem;background:var(--chip);border-radius:6px;padding:1px 6px;color:var(--acc2)}
.group-h{font-weight:700;color:var(--acc2);margin:14px 2px 6px;font-size:.9rem;text-transform:capitalize}
.hero{width:100%;max-height:230px;object-fit:cover;border-radius:10px;margin-bottom:6px}
.stars button{background:none;border:0;font-size:1.4rem;color:#c99a2e;padding:0 2px}
.fav{background:none;border:0;font-size:1.6rem;color:var(--acc)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.facts span{background:var(--chip);border-radius:8px;padding:3px 8px;font-size:.82rem}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{padding:7px 2px;border-bottom:1px dashed var(--line)}
ul.ing li.hd{font-weight:700;color:var(--acc2);border:0;padding-top:12px}
ul.ing li.done,ol.steps li.done{text-decoration:line-through;opacity:.45}
ol.steps{padding-left:22px;margin:0}
ol.steps li{padding:6px 2px;margin-bottom:4px}
ol.steps li.cur{background:#fde9c8;border-radius:8px}
ol.steps li.hd{list-style:none;font-weight:700;color:var(--acc2);margin-left:-22px}
.scale{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.scale button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:1.2rem}
.comment{border-left:3px solid var(--acc);padding:4px 8px;margin:8px 0;white-space:pre-wrap}
.day{padding:10px 12px}
.day.today{border-color:var(--acc);box-shadow:0 0 0 2px rgba(181,83,42,.15)}
.day-h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.entry{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.entry:last-child{border:0}
.entry .slot{font-size:.7rem;text-transform:uppercase;color:var(--muted);width:64px;flex:none;font-weight:700}
.entry .what{flex:1;min-width:0}
.entry .x{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:0 6px}
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.shop-item input{width:22px;height:22px;flex:none}
.shop-item .t{flex:1;min-width:0}
.shop-item.done .t{text-decoration:line-through;opacity:.5}
.pick{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.pick button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px}
.pick label{display:flex;gap:10px;align-items:flex-start;margin:0;padding:9px 10px;border-bottom:1px solid var(--line);font-size:.95rem;color:var(--ink);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--acc2)}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:8px}
.res div:nth-child(odd){color:var(--muted)}
.res div:nth-child(even){font-weight:700;text-align:right}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-size:.85rem;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.modal h3{font-size:1.1rem}
.menu-list button{display:block;width:100%;text-align:left;padding:14px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3b2a1e;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;max-width:90vw;text-align:center}
.banner{background:#fde9c8;border:1px solid #e8c58a;border-radius:12px;padding:10px;margin-bottom:10px;font-size:.9rem}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.status{margin-top:10px;font-size:.88rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <a href="#recipes" data-tab="recipes"><span>📖</span>Recipes</a>
  <a href="#plan" data-tab="plan"><span>📅</span>Planner</a>
  <a href="#shop" data-tab="shop"><span>🛒</span>Shopping</a>
  <a href="#convert" data-tab="convert"><span>⚖️</span>Convert</a>
  <a href="#data" data-tab="data"><span>💾</span>Data</a>
</nav>
<script>
'use strict';
const VERSION = '2026-11-27.2';
const KEY = 'cooking.data.v1';
const UIKEY = 'cooking.ui.v1';
const FALLBACK_PROXIES = [
  'https://api.allorigins.win/raw?url={url}',
  'https://corsproxy.io/?url={url}',
  'https://api.codetabs.com/v1/proxy?quest={url}'
];
const SOURCE_TYPES = ['Website','Cookbook','Magazine','Family','Friend','TV / Video','My own','Other'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowIso = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDate = s => s ? new Date(s).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtDay = d => d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const safeImg = u => /^(https?:\/\/|data:image\/)/i.test(u || '') ? u : '';
const uniq = a => [...new Set(a)];
const isHeading = l => /^#/.test(l) || (/:$/.test(l) && l.length < 45);
const stripHd = l => l.replace(/^#+\s*/, '').replace(/:$/, '');
function fmtMins(m) { m = +m; if (!m) return ''; const h = Math.floor(m / 60), mm = m % 60; return (h ? h + ' h' : '') + (h && mm ? ' ' : '') + (mm ? mm + ' min' : ''); }
function toast(msg, ms = 2200) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function opts(list, sel) { return list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`; }).join(''); }
function go(h) { location.hash = h; }
function back() { if (history.length > 1) history.back(); else go('recipes'); }
function htmlText(s) { if (s == null) return ''; return (new DOMParser().parseFromString(String(s), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim(); }
function download(name, text, type = 'text/plain') {
  const blob = new Blob([text], {type: type + ';charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function shareText(title, text) {
  if (navigator.share) { try { await navigator.share({title, text}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); } catch (e) { download(title.replace(/[^\w-]+/g, '_') + '.txt', text); }
}
const csvCell = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCsv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');

/* ---------- data ---------- */
function blank() {
  return { version: 1, recipes: [], plan: {}, shopping: [],
    settings: { slots: ['Breakfast', 'Lunch', 'Dinner'], weekStart: 1, proxy: '' },
    meta: { created: nowIso(), lastBackup: null } };
}
function fixRecipe(r) {
  const t = nowIso();
  const x = Object.assign({ id: uid(), title: 'Untitled', sourceType: '', source: '', sourceUrl: '', author: '', servings: '',
    prepMins: '', cookMins: '', tags: [], ingredients: [], method: [], notes: '', description: '', comments: [], image: '',
    rating: 0, fav: false, added: t, updated: t, cooked: [] }, r || {});
  ['tags', 'ingredients', 'method', 'comments', 'cooked'].forEach(k => { if (!Array.isArray(x[k])) x[k] = []; });
  return x;
}
function normalise(d) {
  const b = blank();
  d.settings = Object.assign(b.settings, d.settings || {});
  d.meta = Object.assign(b.meta, d.meta || {});
  d.plan = d.plan && typeof d.plan === 'object' ? d.plan : {};
  d.shopping = Array.isArray(d.shopping) ? d.shopping : [];
  d.recipes = (d.recipes || []).map(fixRecipe);
  return d;
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.recipes)) return normalise(d); } catch (e) {}
  return blank();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('Could not save – storage may be full. Please back up and remove large images.'); }
}
let ui = Object.assign({ q: '', scope: 'all', sort: 'added-desc', tags: [], fav: false, weekOffset: 0, convTab: 'weight', importTab: 'web', shopSort: 'added' },
  (() => { try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch (e) { return {}; } })());
ui.scale = {};
function saveUi() { const { q, scale, ...keep } = ui; localStorage.setItem(UIKEY, JSON.stringify(keep)); }
const R = id => S.recipes.find(r => r.id === id);

/* ---------- quantity scaling ---------- */
const UF = {'½': .5, '⅓': 1 / 3, '⅔': 2 / 3, '¼': .25, '¾': .75, '⅛': .125};
const QRE = '(?:\\d+\\s*[½⅓⅔¼¾⅛]|\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?|[½⅓⅔¼¾⅛])';
const SCALE_RE = new RegExp('^(\\s*)(' + QRE + ')(?:(\\s*(?:-|–|to)\\s*)(' + QRE + '))?');
function parseQ(s) {
  s = s.trim(); let m;
  if ((m = s.match(/^(\d+)\s*([½⅓⅔¼¾⅛])$/))) return +m[1] + UF[m[2]];
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  if (UF[s] != null) return UF[s];
  return parseFloat(s);
}
function fmtQ(n) {
  if (n >= 20) return String(Math.round(n));
  const w = Math.floor(n), f = n - w;
  const fr = [[0, ''], [.125, '⅛'], [.25, '¼'], [1 / 3, '⅓'], [.5, '½'], [2 / 3, '⅔'], [.75, '¾'], [1, '']];
  let best = fr[0], bd = 1;
  for (const x of fr) { const d = Math.abs(f - x[0]); if (d < bd) { bd = d; best = x; } }
  if (bd < 0.04) { const ww = best[0] === 1 ? w + 1 : w; return ((ww ? ww : '') + best[1]) || '0'; }
  return String(Math.round(n * 10) / 10);
}
function scaleLine(l, f) {
  if (f === 1 || isHeading(l)) return l;
  return l.replace(SCALE_RE, (m, sp, a, sep, b) => sp + fmtQ(parseQ(a) * f) + (b ? sep + fmtQ(parseQ(b) * f) : ''));
}
function scaleFactor(r) { const base = parseFloat(r.servings); const t = ui.scale[r.id]; return base > 0 && t ? t / base : 1; }

/* ---------- header / router ---------- */
function setHeader(title, o = {}) {
  $('#hdr').innerHTML = (o.back ? `<button class="back" onclick="back()" aria-label="Back">‹</button>` : '') +
    `<h1>${esc(title)}</h1>` + (o.actions || []).map(([l, fn]) => `<button onclick="${fn}">${l}</button>`).join('');
}
let lastView = '';
function render() {
  if (location.hash.startsWith('#cookimport=')) { handleCookImport(location.hash.slice(12)); return; }
  const h = decodeURIComponent(location.hash.slice(1)) || 'recipes';
  const [v, arg] = h.split('/');
  const tab = ['recipe', 'edit', 'import'].includes(v) ? 'recipes' : v;
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  closeModal();
  const views = { recipes: viewRecipes, recipe: viewRecipe, edit: viewEdit, import: viewImport, plan: viewPlan, shop: viewShop, convert: viewConvert, data: viewData };
  (views[v] || viewRecipes)(arg);
  if (h !== lastView) { window.scrollTo(0, 0); lastView = h; }
}
window.addEventListener('hashchange', render);

/* ---------- modal ---------- */
function openModal(html) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  return bg;
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }

/* ================= RECIPES LIST ================= */
const SORTS = [['added-desc', 'Newest added'], ['added-asc', 'Oldest added'], ['title-asc', 'Name A–Z'], ['title-desc', 'Name Z–A'],
  ['updated-desc', 'Recently updated'], ['cooked-desc', 'Recently cooked'], ['count-desc', 'Most cooked'], ['rating-desc', 'Highest rated'],
  ['time-asc', 'Quickest'], ['tag-asc', 'By tag'], ['source-asc', 'By origin']];
const SCOPES = [['all', 'Search everything'], ['title', 'Recipe name'], ['tag', 'Tags'], ['ing', 'Ingredients'], ['origin', 'Origin / author'], ['comments', 'Notes & comments']];
function tagCounts() {
  const c = {}; S.recipes.forEach(r => r.tags.forEach(t => c[t] = (c[t] || 0) + 1));
  return Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function totalMins(r) { return (+r.prepMins || 0) + (+r.cookMins || 0); }
function lastCooked(r) { return r.cooked.length ? r.cooked[r.cooked.length - 1] : ''; }
function filtered() {
  const terms = ui.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = S.recipes.filter(r => {
    if (ui.fav && !r.fav) return false;
    if (ui.tags.length && !ui.tags.every(t => r.tags.includes(t))) return false;
    if (!terms.length) return true;
    const parts = {
      title: [r.title], tag: r.tags, ing: r.ingredients, origin: [r.sourceType, r.source, r.sourceUrl, r.author],
      comments: [r.notes, ...r.comments.map(c => c.text)]
    };
    const hay = (ui.scope === 'all' ? [...Object.values(parts).flat(), r.description, ...r.method] : parts[ui.scope]).join(' \n ').toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  const by = {
    'added-desc': (a, b) => b.added.localeCompare(a.added), 'added-asc': (a, b) => a.added.localeCompare(b.added),
    'title-asc': (a, b) => a.title.localeCompare(b.title), 'title-desc': (a, b) => b.title.localeCompare(a.title),
    'updated-desc': (a, b) => b.updated.localeCompare(a.updated),
    'cooked-desc': (a, b) => lastCooked(b).localeCompare(lastCooked(a)), 'count-desc': (a, b) => b.cooked.length - a.cooked.length,
    'rating-desc': (a, b) => (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title),
    'time-asc': (a, b) => (totalMins(a) || 9e9) - (totalMins(b) || 9e9),
    'tag-asc': (a, b) => (a.tags[0] || '~').localeCompare(b.tags[0] || '~') || a.title.localeCompare(b.title),
    'source-asc': (a, b) => (a.source || a.sourceType || '~').localeCompare(b.source || b.sourceType || '~') || a.title.localeCompare(b.title)
  };
  return list.sort(by[ui.sort] || by['added-desc']);
}
function viewRecipes() {
  setHeader('Cooking', { actions: [['＋ Add', 'addMenu()']] });
  if (!S.recipes.length) {
    main.innerHTML = `<div class="empty"><div style="font-size:3rem">🍳</div><h2>Welcome to Cooking</h2>
      <p>Store your recipes, plan the week's meals and build a shopping list.</p></div>
      <div class="menu-list">${addMenuButtons()}<button onclick="addSample()">🧁 Add a sample recipe to try things out</button></div>`;
    return;
  }
  const tags = tagCounts();
  main.innerHTML = `
    <input type="search" id="q" placeholder="Search ${S.recipes.length} recipes…" value="${esc(ui.q)}" oninput="ui.q=this.value;listRecipes()">
    <div class="row mt">

function recipeText(r, f = 1) {
  const L = [r.title.toUpperCase(), ''];

function lbOz(g) { const oz = g / 28.3495; if (oz < 16) return fmtQ(Math.round(oz * 4) / 4) + ' oz'; const lb = Math.floor(oz / 16), r = Math.round(oz - lb * 16); return lb + ' lb' + (r ? ' ' + r + ' oz' : ''); }

  const U = ui.convTab === 'weight' ? WEIGHT : VOLUME, v = parseFloat($('#cv').value) || 0, base = v * U[$('#cu').value][1];

function calcTemp() {

async function backup(share) {
  S.meta.lastBackup = nowIso(); save();
  const name = 'cooking-backup-' + isoDay(new Date()) + '.json', txt = JSON.stringify(Object.assign({ app: 'cooking', appVersion: VERSION, exported: nowIso() }, S), null, 1);
  if (share) {
    const file = new File([txt], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); viewData(); return; } catch (e) { if (e.name === 'AbortError') return; } }
  }
  download(name, txt, 'application/json'); toast('Backup downloaded'); viewData();
}
function restoreFile(file) {
  if (!file) return; const rd = new FileReader();
  rd.onload = () => { try { const j = JSON.parse(rd.result); if (!Array.isArray(j.recipes)) throw 0; restoreData(j); } catch (e) { toast('That is not a Cooking backup file'); } };
  rd.readAsText(file);
}
function restoreData(j) {
  const n = j.recipes.length;
  openModal(`<h3>Restore backup</h3><p>This backup has <b>${n}</b> recipe${n === 1 ? '' : 's'}${j.exported ? ' and was made ' + fmtDate(j.exported) : ''}.</p>

    <button id="rRep" style="color:var(--danger)">♻️ <b>Replace everything</b><div class="muted">Wipe this phone's data and use the backup</div></button></div>`);
  $('#rRep').onclick = () => {
    if (!confirm('Replace ALL current data with the backup?')) return;
    const { app, appVersion, exported, ...d } = j; S = normalise(d); save(); closeModal(); toast('Backup restored'); go('recipes'); render();
  };
  $('#rMerge').onclick = () => {
    const inc = normalise(JSON.parse(JSON.stringify(j))); let add = 0, upd = 0;
    inc.recipes.forEach(r => { const ex = R(r.id); if (!ex) { S.recipes.push(r); add++; } else if (r.updated > ex.updated) { Object.assign(ex, r); upd++; } });
    Object.entries(inc.plan).forEach(([k, a]) => { const cur = S.plan[k] = S.plan[k] || []; a.forEach(e => { if (!cur.some(x => x.id === e.id)) cur.push(e); }); });
    inc.shopping.forEach(i => { if (!S.shopping.some(x => x.id === i.id)) S.shopping.push(i); });
    save(); closeModal(); toast(`Merged: ${add} new, ${upd} updated`); go('recipes'); render();
  };
}

(function init() {
  const p = new URLSearchParams(location.search);
  const sharedUrl = p.get('url') || ((p.get('text') || '').match(/https?:\/\/\S+/) || [])[0];
  if (sharedUrl || p.get('text')) {
    history.replaceState(null, '', location.pathname + '#import');
    if (sharedUrl) { ui.importTab = 'web'; pendingImport = { url: sharedUrl, auto: true }; }
    else { ui.importTab = 'text'; pendingImport = { text: [p.get('title'), p.get('text')].filter(Boolean).join('\n') }; }
  }
  render();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  document.addEventListener('visibilitychange', async () => { if (wakeLock !== null && document.visibilityState === 'visible' && 'wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} } });
})();
